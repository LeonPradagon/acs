name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'

    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run Linter
      run: npm run lint
      continue-on-error: true

    - name: Run Unit Tests
      run: npm run test

    - name: Type Check
      run: npx tsc --noEmit

    - name: Build
      run: npm run build

  test-and-build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./acs-frontend

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './acs-frontend/package-lock.json'

    - name: Install Dependencies
      run: npm ci --legacy-peer-deps

    - name: Build
      run: npm run build
